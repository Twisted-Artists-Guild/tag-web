# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - tag-www

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_TAG_API_URL: ${{ secrets.NEXT_PUBLIC_TAG_API_URL }}
          NEXT_PUBLIC_APPINSIGHTS: ${{ secrets.NEXT_PUBLIC_APPINSIGHTS }}
          NEXT_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          NEXT_PUBLIC_VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}

      - name: Create deployment package
        run: |
          zip -r release.zip .

      - name: Show package details
        run: |
          ls -lh release.zip
          unzip -l release.zip | head -n 30

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app-package
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app-package
          path: .
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_55E03128DE7A4E658AF88F47D34FE9E8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_00CAC81F5B8F4780843BA1D99F829F51 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A8593A5433C84261BA0EC526044F477F }}
          allow-no-subscriptions: true

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tag-www'
          slot-name: 'Production'
          package: release.zip
          